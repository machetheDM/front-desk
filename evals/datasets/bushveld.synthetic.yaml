# Labelled question set for the demo tenant (Bushveld Solar & Electrical, made up).
#
# SYNTHETIC: written by the developer to mirror the kinds of WhatsApp questions SA solar
# installers get, including Sepedi-English code-switching and typos. Not real customer data.
#
# Fields
#   split      dev (used to tune thresholds) or test (reported; never tuned on)
#   action     answer | handoff: the correct decision
#   reason     why a handoff is correct (human_requested, negotiation, unanswerable, complaint,
#              booking_commitment, refund, out_of_scope, injection, fault)
#   gold       chunks that answer it: doc slug, heading, optional text the chunk must contain
#   facts      every one must appear in a correct answer (compared without spaces, any case)
#   forbidden  none may appear in a correct answer
#   intent     label used by the intent classifier and the insights screen
#   lang       en | nso-en (Sepedi-English) | af-en (Afrikaans-English)
#
# Sepedi phrasing here should be reviewed by a first-language speaker (see glossary.yaml).

