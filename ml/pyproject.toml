[project]
name = "frontdesk-ml"
version = "0.1.0"
description = "Front Desk evaluation, classifiers and insights"
requires-python = ">=3.12"
# umap-learn 0.5.12 is the first release that works with scikit-learn 1.8+ (force_all_finite was removed).
dependencies = ["frontdesk", "numpy>=1.26", "scikit-learn>=1.5", "scipy>=1.11", "pyyaml>=6.0", "umap-learn>=0.5.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frontdesk_ml*"]
