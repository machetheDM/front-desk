[project]
name = "frontdesk-ml"
version = "0.1.0"
description = "Front Desk evaluation, classifiers and insights"
requires-python = ">=3.12"
dependencies = ["frontdesk", "numpy>=1.26", "scikit-learn>=1.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
insights = ["umap-learn>=0.5.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frontdesk_ml*"]
