# Sepedi (Northern Sotho) and township-English terms customers mix into English questions,
# mapped to the English words the company's documents use. Applied to the query only, before
# retrieval, so "Theko ya 5kW ke bokae?" also searches "price 5kW how much".
#
# STATUS: drafted from common usage; must be reviewed by a first-language Sepedi speaker
# before a client sees results. Wrong entries hurt recall silently, so each change should be
# followed by a replay run (recall@5 is reported per language tag in the eval report).
phrases:
  "ke bokae": "how much price cost"
  "ke kopa": "please request"
  "le bula neng": "opening hours when open"
  "le tswalela neng": "closing hours when close"
  "le kae": "where location address"
  "go tsenya": "install installation"
  "load shedding": "load-shedding power outage"
  "loadshedding": "load-shedding power outage"
  "lights off": "power outage load-shedding"
  "tse kae": "how many"
  "e tla tshwara": "last"
  "ge go na le": "during"
  "e nngwe": "extra another"
  "site visit": "site assessment"
  "come and look": "site assessment"
  "come look": "site assessment"
  # English paraphrases customers use for terms the documents state differently
  "payment plan": "finance"
  "bought online": "bought elsewhere"
  "bought it online": "bought elsewhere"
  "office hours": "open opening hours when open"  # found by the demo replay: handed over three times
