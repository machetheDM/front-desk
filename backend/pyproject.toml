[project]
name = "frontdesk"
version = "0.1.0"
description = "Front Desk: grounded customer assistant for South African SMEs"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "cryptography>=43",
]

[project.optional-dependencies]
local = ["psycopg[binary]>=3.2"]
dev = ["psycopg[binary]>=3.2", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
frontdesk-replay = "frontdesk.replay:main"
frontdesk-migrate = "frontdesk.db.migrate:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frontdesk*"]

[tool.setuptools.package-data]
frontdesk = ["llm/prompts/*.md", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres with pgvector (FRONTDESK_TEST_DSN)"]
